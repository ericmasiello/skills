# PROTOTYPE. Replaces the image's conf.d, so the stock default server is gone.
# Serve adds X-Forwarded-For (the tailnet IP) and Tailscale-User-Login (for
# devices owned by a user), so the log says which device fetched what.
log_format podfeed '$time_iso8601 $status "$request" bytes=$body_bytes_sent '
                   'range="$http_range" rt=$request_time '
                   'client=$http_x_forwarded_for user="$http_tailscale_user_login" '
                   'ua="$http_user_agent"';

server {
    # Only Serve, in the same network namespace, can reach this.
    listen 127.0.0.1:8080;
    server_tokens off;
    root /srv/podcast;
    autoindex off;
    access_log /dev/stdout podfeed;

    # Dot-paths (.part temp files), DSM's @eaDir and #recycle.
    location ~ (^|/)\. { return 404; }
    location ~ (^|/)(@eaDir|#recycle)(/|$) { return 404; }

    location = / { return 404; }

    location = /feed.xml {
        types { }
        default_type application/rss+xml;
    }

    # mime.types already maps .mp3 to audio/mpeg; byte ranges are on by default.
    location / {
        try_files $uri =404;
    }
}
